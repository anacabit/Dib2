<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎨 Estudio de Arte</title>
<style>
:root{--hdr:42px;--bot:62px;--sb:64px;--pu:#6C3FC8;--pk:#E040FB;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;background:#888;font-family:'Segoe UI',sans-serif;}
#hdr{position:fixed;top:0;left:0;right:0;height:var(--hdr);background:linear-gradient(135deg,var(--pu),var(--pk));display:flex;align-items:center;justify-content:space-between;padding:0 5px;z-index:300;box-shadow:0 2px 8px #0003;}
#hdr h1{color:#fff;font-size:.75rem;font-weight:700;}
#hdr-btns{display:flex;gap:3px;}
.hbtn{background:rgba(255,255,255,.22);border:none;border-radius:7px;color:#fff;font-size:.58rem;font-weight:700;padding:3px 6px;cursor:pointer;white-space:nowrap;}
.hbtn:active{background:rgba(255,255,255,.45);}
.hbtn.red{background:rgba(255,60,60,.4);}
#app{position:fixed;top:var(--hdr);left:0;right:0;bottom:var(--bot);display:flex;}
#sidebar{width:var(--sb);background:#fff;border-right:1px solid #DDD8F8;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:2px;padding:3px 2px;scrollbar-width:thin;scrollbar-color:#C0B0EE transparent;flex-shrink:0;z-index:100;}
#sidebar::-webkit-scrollbar{width:3px;}
#sidebar::-webkit-scrollbar-thumb{background:#C0B0EE;border-radius:2px;}
#sb-search{padding:2px 2px 0;flex-shrink:0;}
#sb-search input{width:100%;font-size:.58rem;padding:3px 4px;border:1.5px solid #DDD8F8;border-radius:6px;outline:none;}
.sb-sect{font-size:.44rem;color:#aaa;text-transform:uppercase;letter-spacing:.5px;padding:3px 2px 1px;font-weight:700;}
.icon-key{width:100%;aspect-ratio:1;background:#FAFAFE;border:1.5px solid #DDD8F8;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;flex-shrink:0;transition:transform .1s,border-color .12s;}
.icon-key:active{transform:scale(.85);}
.icon-key.sel{border-color:var(--pu);background:#EDE8FF;}
.icon-key svg{stroke:#111;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.icon-key span{font-size:.4rem;color:#888;text-align:center;line-height:1;}
#canvas-area{flex:1;position:relative;overflow:hidden;background:#888;display:flex;align-items:center;justify-content:center;}
#sheet-wrap{position:relative;background:#fff;box-shadow:0 4px 28px #0006;}
#paint-canvas{position:absolute;top:0;left:0;z-index:2;touch-action:none;cursor:crosshair;}
#sticker-layer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:3;pointer-events:none;}
/* STICKER — solo SVG o imagen, sin bordes */
.sticker{position:absolute;pointer-events:all;touch-action:none;user-select:none;}
.sticker svg,.sticker img{display:block;width:100%;height:100%;}
.sticker img{object-fit:contain;cursor:move;}
/* handles pequeños, pegados a las esquinas */
.sh-del{position:absolute;top:-8px;left:-8px;width:18px;height:18px;background:#FF3B30;border-radius:50%;border:2px solid #fff;color:#fff;font-size:.55rem;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20;box-shadow:0 1px 4px #0005;}
.sh-fill{position:absolute;top:-8px;right:-8px;width:18px;height:18px;border-radius:50%;border:2px solid #fff;cursor:pointer;z-index:20;box-shadow:0 1px 4px #0005;}
.sh-resize{position:absolute;bottom:-8px;right:-8px;width:20px;height:20px;background:rgba(108,63,200,.9);border-radius:50%;border:2px solid #fff;color:#fff;font-size:.65rem;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:se-resize;z-index:20;box-shadow:0 1px 4px #0005;}
/* BOTTOM */
#bottom{position:fixed;bottom:0;left:0;right:0;height:var(--bot);background:#fff;border-top:1px solid #DDD8F8;display:flex;align-items:center;padding:0 4px;gap:3px;z-index:300;box-shadow:0 -2px 8px #0001;overflow:hidden;}
.tbtn{width:34px;height:34px;flex-shrink:0;border-radius:9px;border:1.5px solid #DDD8F8;background:#F8F5FF;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.88rem;transition:background .1s,transform .1s;}
.tbtn:active{transform:scale(.85);}
.tbtn.on{background:var(--pu);border-color:var(--pu);}
#sz-wrap{display:flex;flex-direction:column;align-items:center;gap:1px;flex-shrink:0;}
#sz-label{font-size:.4rem;color:#aaa;text-transform:uppercase;}
#sz{-webkit-appearance:none;width:44px;height:4px;border-radius:2px;background:linear-gradient(to right,var(--pu),var(--pk));outline:none;}
#sz::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--pu);border:2.5px solid white;box-shadow:0 1px 4px #0003;}
#pal-wrap{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;}
#pal-top{display:flex;align-items:center;gap:3px;}
#brush-preview{border-radius:4px;flex-shrink:0;border:1px solid #eee;}
#palette{display:flex;gap:3px;flex:1;overflow-x:auto;scrollbar-width:none;align-items:center;}
#palette::-webkit-scrollbar{display:none;}
.dot{width:28px;height:28px;flex-shrink:0;border-radius:50%;border:2.5px solid white;cursor:pointer;box-shadow:0 1px 4px #0002;transition:transform .1s;}
.dot:active{transform:scale(.85);}
.dot.sel{border-color:#333;box-shadow:0 0 0 2px #3336;transform:scale(1.15);}
/* Modales */
.modal-bg{display:none;position:fixed;inset:0;background:#0007;z-index:500;align-items:center;justify-content:center;}
.modal-bg.open{display:flex;}
.modal-box{background:#fff;border-radius:18px;padding:14px;width:88%;max-width:300px;box-shadow:0 8px 32px #0004;}
.modal-box h2{font-size:.88rem;color:#333;margin-bottom:10px;text-align:center;}
#fm-dots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:10px;}
.fmd{aspect-ratio:1;border-radius:50%;border:2.5px solid white;cursor:pointer;box-shadow:0 1px 4px #0002;transition:transform .1s;}
.fmd.sel{border-color:#333;transform:scale(1.18);}
.fw-row{display:flex;gap:6px;align-items:center;margin-bottom:8px;}
.fw-row label{font-size:.72rem;color:#666;white-space:nowrap;}
#fw{-webkit-appearance:none;flex:1;height:4px;border-radius:2px;background:linear-gradient(to right,var(--pu),var(--pk));outline:none;}
#fw::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:var(--pu);border:2.5px solid white;}
#fm-preview{width:100%;height:52px;border-radius:8px;margin-bottom:10px;position:relative;overflow:hidden;}
#fm-preview-inner{position:absolute;background:#fff;}
.modal-btns{display:flex;gap:8px;}
.mbtn{flex:1;padding:9px;border:none;border-radius:10px;font-size:.78rem;font-weight:700;cursor:pointer;}
.mbtn:active{opacity:.75;}
.mbtn.cancel{background:#F0ECFF;color:var(--pu);}
.mbtn.ok{background:linear-gradient(135deg,var(--pu),var(--pk));color:white;}
.mbtn.green{background:#34C759;color:white;}
/* Modal letras */
#lt-bg{display:none;position:fixed;inset:0;background:#0007;z-index:500;align-items:flex-end;justify-content:center;}
#lt-bg.open{display:flex;}
#lt-box{background:#fff;border-radius:18px 18px 0 0;padding:12px 10px 16px;width:100%;max-width:460px;box-shadow:0 -4px 24px #0004;}
#lt-box h2{font-size:.85rem;color:#333;margin-bottom:8px;text-align:center;}
#lt-kbd{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-bottom:7px;}
.lkey{padding:5px 1px;border:1.5px solid #DDD8F8;border-radius:7px;background:#F8F5FF;font-size:.75rem;font-weight:700;cursor:pointer;text-align:center;color:#333;}
.lkey:active{background:var(--pu);color:white;}
#lt-preview{min-height:30px;background:#f0ecff;border-radius:8px;padding:5px 8px;font-size:1rem;font-weight:900;letter-spacing:2px;color:#333;margin-bottom:7px;text-align:center;word-break:break-all;}
#lt-opts{display:flex;gap:5px;margin-bottom:8px;align-items:center;flex-wrap:wrap;}
.lt-opt-btn{padding:4px 7px;border:1.5px solid #DDD8F8;border-radius:7px;background:#F8F5FF;font-size:.6rem;font-weight:700;cursor:pointer;color:#555;}
.lt-opt-btn.on{background:var(--pu);color:white;border-color:var(--pu);}
#lt-size{-webkit-appearance:none;width:70px;height:4px;border-radius:2px;background:linear-gradient(to right,var(--pu),var(--pk));outline:none;}
#lt-size::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--pu);border:2px solid white;}
.lt-btns{display:flex;gap:6px;}
#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(50px);background:#222;color:#fff;padding:6px 16px;border-radius:14px;font-size:.78rem;z-index:999;pointer-events:none;transition:transform .25s;white-space:nowrap;}
#toast.show{transform:translateX(-50%) translateY(0);}
/* Input file oculto */
#file-input{display:none;}
</style>
</head>
<body>
<header id="hdr">
  <h1>🎨 Estudio de Arte</h1>
  <div id="hdr-btns">
    <button class="hbtn red" id="btn-sin-iconos">🗂️ Sin íconos</button>
    <button class="hbtn red" id="btn-limpiar">🗑️ Todo</button>
    <button class="hbtn" id="btn-finalizar">🖼️ Marco</button>
    <button class="hbtn" id="btn-guardar">🖨️ Imprimir</button>
  </div>
</header>
<div id="app">
  <div id="sidebar">
    <div id="sb-search"><input type="text" id="sb-input" placeholder="🔍 buscar..."></div>
  </div>
  <div id="canvas-area">
    <div id="sheet-wrap">
      <canvas id="paint-canvas"></canvas>
      <div id="sticker-layer"></div>
    </div>
  </div>
</div>
<div id="bottom">
  <div style="display:flex;flex-direction:column;gap:2px;flex-shrink:0;">
    <button class="tbtn on" id="btn-pincel">🖌️</button>
    <button class="tbtn" id="btn-borra">🩹</button>
  </div>
  <div id="sz-wrap">
    <span id="sz-label">Grosor</span>
    <input type="range" id="sz" min="2" max="36" value="10">
  </div>
  <button class="tbtn" id="btn-letra" title="Letras">🔤</button>
  <button class="tbtn" id="btn-foto" title="Poner foto">🖼️</button>
  <input type="file" id="file-input" accept="image/*">
  <div id="pal-wrap">
    <div id="pal-top">
      <canvas id="brush-preview" width="34" height="16"></canvas>
      <div id="palette"></div>
    </div>
  </div>
</div>

<!-- Modal marco -->
<div class="modal-bg" id="fm-bg">
  <div class="modal-box">
    <h2>🖼️ Marco de tu obra</h2>
    <div id="fm-dots"></div>
    <div class="fw-row">
      <label>Grosor</label>
      <input type="range" id="fw" min="6" max="80" value="26">
      <span id="fw-val" style="font-size:.68rem;color:#888;min-width:20px;">26</span>
    </div>
    <div id="fm-preview"><div id="fm-preview-inner"></div></div>
    <div class="modal-btns">
      <button class="mbtn cancel" id="fm-cancel">Cancelar</button>
      <button class="mbtn ok" id="fm-apply">✨ Aplicar</button>
    </div>
  </div>
</div>

<!-- Modal letras -->
<div id="lt-bg">
  <div id="lt-box">
    <h2>🔤 Escribir en la hoja</h2>
    <div id="lt-preview">_</div>
    <div id="lt-kbd"></div>
    <div id="lt-opts">
      <button class="lt-opt-btn on" id="lt-dir-h">→ Horiz.</button>
      <button class="lt-opt-btn" id="lt-dir-v">↓ Vert.</button>
      <button class="lt-opt-btn" id="lt-dir-d">↗ Diag.</button>
      <span style="font-size:.58rem;color:#888;">Tamaño:</span>
      <input type="range" id="lt-size" min="16" max="120" value="48">
    </div>
    <div class="lt-btns">
      <button class="mbtn cancel" id="lt-cancel">Cancelar</button>
      <button class="mbtn green" id="lt-fill">🔁 Rellenar hoja</button>
      <button class="mbtn ok" id="lt-place">✅ Colocar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>

// Helper para crear SVG de Lucide (viewBox 24x24)
function lucideSVG(name,sz=38){
  const paths=LUCIDE[name]||[];
  return `<svg viewBox="0 0 24 24" width="${sz}" height="${sz}" fill="none" stroke="#111" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${paths.map(d=>`<path d="${d}"/>`).join('')}</svg>`;
}

// ═══ LAYOUT ═══
function layout(){
  const R=document.getElementById('canvas-area').getBoundingClientRect();
  SW=Math.floor(R.width);SH=Math.floor(R.height);
  const wrap=document.getElementById('sheet-wrap');
  wrap.style.width=SW+'px';wrap.style.height=SH+'px';
  ['paint-canvas','frame-canvas'].forEach(id=>{
    const c=document.getElementById(id);
    c.style.width=SW+'px';c.style.height=SH+'px';
  });
  if(!window._init){
    ['paint-canvas','frame-canvas'].forEach(id=>{
      const c=document.getElementById(id);c.width=SW;c.height=SH;
    });
    const ctx=document.getElementById('paint-canvas').getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,SW,SH);
    window._init=true;
  }
}

// ═══ SIDEBAR ═══
function buildSidebar(){
  const sb=document.getElementById('sidebar');
  [...sb.children].forEach(c=>{if(c.id!=='sb-search')c.remove();});
  const q=(document.getElementById('sb-input').value||'').toLowerCase();
  SECTIONS.forEach(s=>{
    const filtered=s.icons.filter(ic=>!q||ic.label.toLowerCase().includes(q)||s.sect.toLowerCase().includes(q));
    if(!filtered.length)return;
    const h=document.createElement('div');h.className='sb-sect';h.textContent=s.sect;sb.appendChild(h);
    filtered.forEach(ic=>{
      const key=document.createElement('div');
      key.className='icon-key'+(selIcon===ic?' sel':'');
      // Usar Lucide SVG si está disponible, sino custom paths
      const svgHTML=ic.lucide
        ? lucideSVG(ic.lucide,38)
        : `<svg viewBox="0 0 32 32" width="38" height="38" fill="none" stroke="#111" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ic.paths.map(d=>`<path d="${d}"/>`).join('')}</svg>`;
      key.innerHTML=svgHTML+`<span>${ic.label}</span>`;
      key.addEventListener('click',()=>{
        selIcon=ic;eraser=false;
        document.getElementById('btn-pincel').classList.remove('on');
        document.getElementById('btn-borra').classList.remove('on');
        document.getElementById('paint-canvas').style.cursor='copy';
        buildSidebar();
      });
      sb.appendChild(key);
    });
  });
}
document.getElementById('sb-input').addEventListener('input',buildSidebar);

// ═══ STICKER — SVG limpio sin ningún borde ni círculo externo ═══
function makeSVGel(ic){
  if(ic.lucide){
    const paths=LUCIDE[ic.lucide]||[];
    const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
    s.setAttribute('viewBox','0 0 24 24');
    s.style.cssText='display:block;width:100%;height:100%;cursor:crosshair;';
    s.setAttribute('fill','none');s.setAttribute('stroke','#111');
    s.setAttribute('stroke-width','1.5');s.setAttribute('stroke-linecap','round');s.setAttribute('stroke-linejoin','round');
    paths.forEach(d=>{
      const p=document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d',d);p.classList.add('sp');
      p.setAttribute('fill','none');p.setAttribute('stroke','#111');
      p.setAttribute('stroke-width','1.5');p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');
      s.appendChild(p);
    });
    return s;
  } else {
    const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
    s.setAttribute('viewBox','0 0 32 32');
    s.style.cssText='display:block;width:100%;height:100%;cursor:crosshair;';
    ic.paths.forEach(d=>{
      const p=document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke','#111');
      p.setAttribute('stroke-width','1.8');p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');
      p.classList.add('sp');s.appendChild(p);
    });
    return s;
  }
}

function placeSticker(x,y){
  if(!selIcon)return;
  const layer=document.getElementById('sticker-layer');
  const sz=INIT;
  const wrap=document.createElement('div');
  wrap.className='sticker';
  wrap.style.cssText=`left:${Math.max(0,Math.min(SW-sz,x-sz/2))}px;top:${Math.max(0,Math.min(SH-sz,y-sz/2))}px;width:${sz}px;height:${sz}px;position:absolute;pointer-events:all;touch-action:none;user-select:none;`;

  const svgEl=makeSVGel(selIcon);
  wrap.appendChild(svgEl);

  // Pintar zona por toque
  const paint=e=>{const p=e.target.closest('.sp');if(!p)return;e.stopPropagation();p.setAttribute('fill',eraser?'none':color);};
  svgEl.addEventListener('click',paint);
  svgEl.addEventListener('touchend',e=>{e.preventDefault();paint(e);},{passive:false});

  // ✕ borrar — esquina sup izq
  const del=document.createElement('div');del.className='sh-del';del.textContent='✕';
  del.addEventListener('click',e=>{e.stopPropagation();layer.removeChild(wrap);});
  del.addEventListener('touchend',e=>{e.preventDefault();e.stopPropagation();layer.removeChild(wrap);},{passive:false});

  // Color relleno — esquina sup der
  const fillBtn=document.createElement('div');fillBtn.className='sh-fill';fillBtn.style.background=color;
  const fillAll=()=>{wrap.querySelectorAll('.sp').forEach(p=>p.setAttribute('fill',color));fillBtn.style.background=color;};
  fillBtn.addEventListener('click',e=>{e.stopPropagation();fillAll();});
  fillBtn.addEventListener('touchend',e=>{e.preventDefault();e.stopPropagation();fillAll();},{passive:false});

  // ↘ resize — esquina inf der
  const rh=document.createElement('div');rh.className='sh-resize';rh.textContent='↘';
  makeResizable(wrap,rh);

  wrap.appendChild(del);wrap.appendChild(fillBtn);wrap.appendChild(rh);
  layer.appendChild(wrap);
  makeDraggable(wrap,layer);
}

    const img=document.createElement('img');
    img.src=ev.target.result;

    wrap.appendChild(img);

    const del=document.createElement('div');del.className='sh-del';del.textContent='✕';
    del.addEventListener('click',e=>{e.stopPropagation();layer.removeChild(wrap);});

    const rh=document.createElement('div');rh.className='sh-resize';rh.textContent='↘';
    makeResizable(wrap,rh,true);// modo libre: w y h independientes

    wrap.appendChild(del);wrap.appendChild(rh);

  };
  reader.readAsDataURL(file);

});

// ═══ DRAG Y RESIZE ═══
function makeDraggable(el,container){
  let sx,sy,ox,oy;
  const skip=e=>e.target.classList.contains('sh-resize')||e.target.classList.contains('sh-del')||e.target.classList.contains('sh-fill')||e.target.closest('svg');
  const s=(cx,cy)=>{sx=cx;sy=cy;ox=parseInt(el.style.left)||0;oy=parseInt(el.style.top)||0;};
  const m=(cx,cy)=>{el.style.left=Math.max(0,Math.min(container.clientWidth-el.offsetWidth,ox+cx-sx))+'px';el.style.top=Math.max(0,Math.min(container.clientHeight-el.offsetHeight,oy+cy-sy))+'px';};
  el.addEventListener('mousedown',e=>{if(skip(e))return;e.preventDefault();s(e.clientX,e.clientY);const mm=e2=>m(e2.clientX,e2.clientY);const mu=()=>{document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);};document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);});
  el.addEventListener('touchstart',e=>{if(skip(e))return;s(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
  el.addEventListener('touchmove',e=>{if(skip(e))return;e.stopPropagation();e.preventDefault();m(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
}
function makeResizable(el,handle,free=false){
  let sx,sy,ow,oh;
  const start=(cx,cy)=>{sx=cx;sy=cy;ow=el.offsetWidth;oh=el.offsetHeight;};
  const move=(cx,cy)=>{
    const dw=cx-sx,dh=cy-sy;
    if(free){
      el.style.width=Math.max(40,ow+dw)+'px';
      el.style.height=Math.max(40,oh+dh)+'px';
    } else {
      const w=Math.max(40,Math.min(Math.min(SW,SH),ow+dw));
      el.style.width=el.style.height=w+'px';
    }
  };
  handle.addEventListener('mousedown',e=>{e.stopPropagation();e.preventDefault();start(e.clientX,e.clientY);const mm=e2=>move(e2.clientX,e2.clientY);const mu=()=>{document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);};document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);});
  handle.addEventListener('touchstart',e=>{e.stopPropagation();start(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
  handle.addEventListener('touchmove',e=>{e.stopPropagation();e.preventDefault();move(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
}

  rh.addEventListener('touchmove',e=>{e.stopPropagation();e.preventDefault();const ns=Math.max(12,Math.min(200,ow2+(e.touches[0].clientX-sx2)));span.style.fontSize=ns+'px';wrap.style.width=wrap.style.height=(ns+20)+'px';},{passive:false});
  wrap.appendChild(del);wrap.appendChild(rh);layer.appendChild(wrap);makeDraggable(wrap,layer);
  document.getElementById('lt-bg').classList.remove('open');ltText='';document.getElementById('lt-preview').textContent='_';
}
document.getElementById('btn-letra').addEventListener('click',()=>{buildLetrasModal();document.getElementById('lt-bg').classList.add('open');});
document.getElementById('lt-cancel').addEventListener('click',()=>document.getElementById('lt-bg').classList.remove('open'));
document.getElementById('lt-place').addEventListener('click',()=>placeLetter(false));
document.getElementById('lt-fill').addEventListener('click',()=>placeLetter(true));
['lt-dir-h','lt-dir-v','lt-dir-d'].forEach(id=>{document.getElementById(id).addEventListener('click',()=>{ltDir=id.replace('lt-dir-','');['lt-dir-h','lt-dir-v','lt-dir-d'].forEach(i=>document.getElementById(i).classList.remove('on'));document.getElementById(id).classList.add('on');});});
document.getElementById('lt-size').addEventListener('input',e=>ltFontSz=+e.target.value);

// ═══ PINTURA ═══
function initPaint(){
  const canvas=document.getElementById('paint-canvas');const ctx=canvas.getContext('2d');
  const xy=e=>{const r=canvas.getBoundingClientRect();const s=e.touches?e.touches[0]:e;return{x:(s.clientX-r.left)*(canvas.width/r.width),y:(s.clientY-r.top)*(canvas.height/r.height)};};
  const dot=p=>{ctx.beginPath();ctx.arc(p.x,p.y,(eraser?brushSz*2.2:brushSz)/2,0,Math.PI*2);ctx.fillStyle=eraser?'#fff':color;ctx.fill();lx=p.x;ly=p.y;};
  const line=p=>{ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.strokeStyle=eraser?'#fff':color;ctx.lineWidth=eraser?brushSz*2.5:brushSz;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();lx=p.x;ly=p.y;};
  canvas.addEventListener('mousedown',e=>{if(selIcon){const p=xy(e);placeSticker(p.x,p.y);return;}e.preventDefault();painting=true;dot(xy(e));});
  canvas.addEventListener('mousemove',e=>{if(!painting||selIcon)return;e.preventDefault();line(xy(e));});
  canvas.addEventListener('mouseup',()=>painting=false);canvas.addEventListener('mouseleave',()=>painting=false);
  canvas.addEventListener('touchstart',e=>{if(selIcon){const p=xy(e);placeSticker(p.x,p.y);return;}e.preventDefault();painting=true;dot(xy(e));},{passive:false});
  canvas.addEventListener('touchmove',e=>{if(!painting||selIcon)return;e.preventDefault();line(xy(e));},{passive:false});
  canvas.addEventListener('touchend',()=>painting=false);
}

// ═══ PALETA ═══
function buildPalette(){
  const pal=document.getElementById('palette');
  COLORS.forEach((c,i)=>{
    const d=document.createElement('button');d.className='dot'+(i===0?' sel':'');d.style.background=c;
    if(c==='#FFFFFF')d.style.outline='2px solid #ccc';
    d.addEventListener('click',()=>{eraser=false;color=c;document.querySelectorAll('.dot').forEach(b=>b.classList.remove('sel'));d.classList.add('sel');document.getElementById('btn-pincel').classList.add('on');document.getElementById('btn-borra').classList.remove('on');drawPreview();});
    pal.appendChild(d);
  });
}
function drawPreview(){
  const cv=document.getElementById('brush-preview');const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);ctx.fillStyle='#f5f5f5';ctx.fillRect(0,0,cv.width,cv.height);
  const r=Math.min(brushSz/2,7);ctx.beginPath();ctx.arc(cv.width/2,cv.height/2,r,0,Math.PI*2);
  ctx.fillStyle=eraser?'#bbb':color;ctx.fill();
  if(r<6){ctx.strokeStyle='#ccc';ctx.lineWidth=1;ctx.stroke();}
}
document.getElementById('sz').addEventListener('input',e=>{brushSz=+e.target.value;drawPreview();});
document.getElementById('btn-pincel').addEventListener('click',()=>{eraser=false;selIcon=null;document.getElementById('btn-pincel').classList.add('on');document.getElementById('btn-borra').classList.remove('on');document.getElementById('paint-canvas').style.cursor='crosshair';buildSidebar();drawPreview();});
document.getElementById('btn-borra').addEventListener('click',()=>{eraser=true;selIcon=null;document.getElementById('btn-borra').classList.add('on');document.getElementById('btn-pincel').classList.remove('on');document.getElementById('paint-canvas').style.cursor='cell';buildSidebar();drawPreview();});
document.getElementById('btn-sin-iconos').addEventListener('click',()=>{if(!confirm('¿Quitar todos los íconos y fotos?'))return;document.getElementById('sticker-layer').innerHTML='';toast('Hoja sin íconos ✨');});
document.getElementById('btn-limpiar').addEventListener('click',()=>{if(!confirm('¿Borrar TODO?'))return;const pc=document.getElementById('paint-canvas');pc.getContext('2d').fillStyle='#fff';pc.getContext('2d').fillRect(0,0,pc.width,pc.height);document.getElementById('sticker-layer').innerHTML='';const fc=document.getElementById('frame-canvas');fc.getContext('2d').clearRect(0,0,fc.width,fc.height);fc.style.display='none';toast('Hoja nueva ✨');});

// ═══ MARCO ═══
const FCOLS=['#FF3B30','#FF9500','#FFCC00','#34C759','#007AFF','#6C3FC8','#FF2D55','#8B4513','#FF6B00','#5AC8FA','#FFD700','#1C1C1E'];
function buildModal(){
  const fd=document.getElementById('fm-dots');
  FCOLS.forEach((c,i)=>{const d=document.createElement('div');d.className='fmd'+(i===5?' sel':'');d.style.background=c;if(i===5)fColor=c;d.addEventListener('click',()=>{fColor=c;document.querySelectorAll('.fmd').forEach(b=>b.classList.remove('sel'));d.classList.add('sel');updatePrev();});fd.appendChild(d);});
  document.getElementById('fw').addEventListener('input',e=>{fWidth=+e.target.value;document.getElementById('fw-val').textContent=fWidth;updatePrev();});
  updatePrev();
}
function updatePrev(){
  const pv=document.getElementById('fm-preview');pv.style.background=fColor;
  const inn=document.getElementById('fm-preview-inner');
  const W=pv.clientWidth||200,H=pv.clientHeight||52;
  const ratio=fWidth/Math.min(SW||300,SH||300);
  const fw=Math.max(4,Math.round(ratio*Math.min(W,H)));
  inn.style.cssText=`position:absolute;background:#fff;left:${fw}px;top:${fw}px;right:${fw}px;bottom:${fw}px;border-radius:2px;`;
}
document.getElementById('btn-finalizar').addEventListener('click',()=>{document.getElementById('fm-bg').classList.add('open');updatePrev();});
document.getElementById('fm-cancel').addEventListener('click',()=>document.getElementById('fm-bg').classList.remove('open'));
document.getElementById('fm-apply').addEventListener('click',()=>{document.getElementById('fm-bg').classList.remove('open');applyFrame();});
function applyFrame(){
  const fc=document.getElementById('frame-canvas');const ctx=fc.getContext('2d');
  const W=fc.width,H=fc.height,fw=fWidth;
  ctx.clearRect(0,0,W,H);fc.style.display='block';
  ctx.save();ctx.fillStyle=fColor;rrect(ctx,0,0,W,H,14);ctx.fill();
  ctx.globalCompositeOperation='destination-out';rrect(ctx,fw,fw,W-fw*2,H-fw*2,8);ctx.fill();ctx.restore();
  ctx.save();ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=2.5;rrect(ctx,fw-5,fw-5,W-(fw-5)*2,H-(fw-5)*2,10);ctx.stroke();
  ctx.strokeStyle='rgba(0,0,0,.12)';ctx.lineWidth=1.8;rrect(ctx,fw+4,fw+4,W-(fw+4)*2,H-(fw+4)*2,6);ctx.stroke();ctx.restore();
  [[fw,fw,1,1],[W-fw,fw,-1,1],[fw,H-fw,1,-1],[W-fw,H-fw,-1,-1]].forEach(([cx,cy,sx,sy])=>{ctx.save();ctx.translate(cx,cy);ctx.scale(sx,sy);ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(0,-4);ctx.moveTo(-14,0);ctx.lineTo(-4,0);ctx.stroke();ctx.restore();});
  toast('¡Marco listo! Puedes seguir dibujando 🖼️');
}
function rrect(ctx,x,y,w,h,r){if(w<r*2)r=w/2;if(h<r*2)r=h/2;if(w<=0||h<=0)return;ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}

// ═══ GUARDAR A4 ═══
document.getElementById('btn-guardar').addEventListener('click',async()=>{
  const PW=1754,PH=1240,scaleX=PW/SW,scaleY=PH/SH;
  const off=document.createElement('canvas');off.width=PW;off.height=PH;
  const ctx=off.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,PW,PH);
  if(document.getElementById('frame-canvas').style.display!=='none'){ctx.save();ctx.scale(scaleX,scaleY);ctx.drawImage(document.getElementById('frame-canvas'),0,0);ctx.restore();}
  ctx.save();ctx.scale(scaleX,scaleY);ctx.drawImage(document.getElementById('paint-canvas'),0,0);ctx.restore();
  const sl=document.getElementById('sticker-layer');
  for(const st of sl.querySelectorAll('.sticker')){
    const x=(parseInt(st.style.left)||0)*scaleX,y=(parseInt(st.style.top)||0)*scaleY;
    const imgEl=st.querySelector('img');
    if(imgEl){ctx.drawImage(imgEl,x,y,st.offsetWidth*scaleX,st.offsetHeight*scaleY);continue;}
    const svgEl=st.querySelector('svg');if(!svgEl)continue;
    const w=st.offsetWidth,h=st.offsetHeight;
    const vb=svgEl.getAttribute('viewBox')||'0 0 32 32';
    const str=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}" width="${w}" height="${h}">${svgEl.innerHTML}</svg>`;
    await new Promise(res=>{const img=new Image();const blob=new Blob([str],{type:'image/svg+xml'});img.onload=()=>{ctx.drawImage(img,x,y,w*scaleX,h*scaleY);URL.revokeObjectURL(img.src);res();};img.onerror=res;img.src=URL.createObjectURL(blob);});
  }
  const a=document.createElement('a');a.download='obra-A4-'+Date.now()+'.png';a.href=off.toDataURL('image/png',1.0);a.click();
  toast('¡Guardado en A4 para imprimir! 🖨️');
});

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}
window.addEventListener('DOMContentLoaded',()=>{layout();buildSidebar();buildPalette();buildModal();initPaint();drawPreview();});
window.addEventListener('resize',layout);
</script>
